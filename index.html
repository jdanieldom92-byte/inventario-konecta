<style>
  :root{
    --bg: #101724;
    --panel: #172032;
    --panel-alt: #1D283D;
    --border: #2C3B57;
    --text: #E8EEFC;
    --muted: #8592B0;
    --accent: #4C8DFF;
    --accent-dim: #1F3A66;
    --bodega: #2FB6A6;
    --viaje: #6C7BF0;
    --danger: #E0637A;
    --header-bg: #172032;
    --header-text: #E8EEFC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-weight:600; margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{
    font-family:'Inter',sans-serif; cursor:pointer; border:none; border-radius:4px;
    padding:10px 16px; font-size:14px; font-weight:600; transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  input, select, textarea{
    font-family:'Inter',sans-serif; background:var(--panel-alt); color:var(--text);
    border:1px solid var(--border); border-radius:4px; padding:10px 12px; font-size:14px;
  }
  .btn-primary{background:var(--accent); color:#FFFFFF;}
  .btn-primary:hover{opacity:.9;}
  .btn-secondary{background:var(--panel-alt); color:var(--text); border:1px solid var(--border);}
  .btn-secondary:hover{background:#333830;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  #app{min-height:100vh;}

  /* ---- Topbar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:2px solid var(--accent);
    background:var(--header-bg); position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .tag{
    background:var(--header-text); color:var(--header-bg); font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:11px; padding:3px 7px; border-radius:3px; letter-spacing:.05em;
  }
  .brand h1{font-size:19px; color:var(--header-text);}
  .session-info{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--header-text); opacity:.9;}
  .role-pill{
    padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; font-family:'IBM Plex Mono',monospace;
  }
  .role-pill.admin{background:var(--header-text); color:var(--header-bg);}
  .role-pill.viewer{background:rgba(255,255,255,.25); color:var(--header-text);}
  .logo-chip{background:var(--header-bg); display:inline-flex; align-items:center; padding:10px 18px; border-radius:10px;}

  /* ---- Tabs ---- */
  .tabs{
    display:flex; gap:2px; padding:0 20px; background:var(--panel);
    border-bottom:1px solid var(--border); overflow-x:auto;
  }
  .tab-btn{
    background:transparent; color:var(--muted); padding:12px 16px; border-radius:0;
    border-bottom:3px solid transparent; font-size:13px; text-transform:uppercase; letter-spacing:.04em;
    white-space:nowrap;
  }
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--text);}

  .content{padding:24px; max-width:1100px; margin:0 auto;}

  /* ---- Login / setup ---- */
  .center-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .ticket{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:32px; width:100%; max-width:400px; position:relative;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:18px; height:18px; background:var(--bg);
    border-radius:50%; top:50%; margin-top:-9px;
  }
  .ticket::before{left:-9px;} .ticket::after{right:-9px;}
  .ticket h2{font-size:22px; margin-bottom:4px;}
  .ticket .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field select{width:100%;}
  .err-msg{color:var(--danger); font-size:13px; margin-top:8px;}
  .divider-or{
    display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px;
    margin:18px 0; text-transform:uppercase; letter-spacing:.05em;
  }
  .divider-or::before, .divider-or::after{content:""; flex:1; height:1px; background:var(--border);}

  /* ---- Dashboard ---- */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px;
  }
  .stat-card .num{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600;}
  .stat-card .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input, .toolbar select{flex:1; min-width:140px;}
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .table-wrap{overflow-x:auto; border-radius:6px;}
  .table-wrap table{min-width:560px;}
  @media (max-width:640px){
    .content{padding:14px;}
    .topbar{padding:12px 14px;}
    .brand h1{font-size:15px;}
    .toolbar{flex-direction:column;}
    .toolbar input, .toolbar select{width:100%;}
  }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--panel-alt);
  }
  td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .status-badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .status-badge.bodega{background:rgba(47,182,166,.18); color:var(--bodega);}
  .status-badge.viaje{background:rgba(108,123,240,.18); color:var(--viaje);}
  .status-badge.fuera_servicio{background:rgba(224,99,122,.18); color:var(--danger);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}

  /* ---- Scan tab ---- */
  .mode-switch{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .mode-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--muted); flex:1; min-width:150px;
  }
  .mode-btn.active{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .scan-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:24px; text-align:center;
  }
  .scan-led{
    width:14px; height:14px; border-radius:50%; background:var(--bodega); display:inline-block; margin-right:8px;
    box-shadow:0 0 8px var(--bodega); animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .scan-input-wrap{margin:18px auto; max-width:360px;}
  .scan-input-wrap input{width:100%; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:16px; padding:14px;}
  .cam-btn{
    width:64px; height:64px; border-radius:50%; background:var(--accent); color:#FFFFFF;
    font-size:24px; margin:10px auto; display:flex; align-items:center; justify-content:center;
  }
  .last-scan{
    margin-top:16px; padding:12px; border-radius:6px; background:var(--panel-alt); font-size:13px; text-align:left;
  }
  .last-scan.ok{border-left:3px solid var(--bodega);}
  .last-scan.error{border-left:3px solid var(--danger);}
  .alta-form{max-width:420px; margin:20px auto 0; text-align:left;}

  /* ---- Modal (camera) ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-box{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; max-width:420px; width:100%;}
  .modal-box video, .modal-box canvas{width:100%; border-radius:6px; background:#000;}
  .modal-close-row{display:flex; justify-content:flex-end; margin-top:14px;}

  /* ---- Labels ---- */
  .label-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-top:18px;}

  /* ---- Calendario ---- */
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-grid-header{margin-bottom:6px;}
  .cal-weekday{text-align:center; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:4px 0;}
  .cal-cell{
    background:var(--panel); border:1px solid var(--border); border-radius:6px; min-height:58px;
    padding:6px; cursor:pointer; position:relative;
  }
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.cal-empty{background:transparent; border:none; cursor:default;}
  .cal-cell.cal-today{border-color:var(--accent); border-width:2px;}
  .cal-cell.cal-selected{background:var(--accent-dim);}
  .cal-daynum{font-size:13px; font-weight:600;}
  .cal-dots{position:absolute; bottom:6px; left:6px; display:flex; gap:4px;}
  .cal-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .cal-dot-event{background:var(--accent);}
  .cal-dot-salida{background:var(--viaje);}
  @media (max-width:640px){
    .cal-cell{min-height:44px; padding:4px;}
    .cal-daynum{font-size:11px;}
  }
  .label-card{
    background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; text-align:center; font-size:12px;
  }
  .label-card .qr-box{background:#fff; padding:8px; border-radius:4px; display:inline-block; margin-bottom:8px;}
  .label-card .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); word-break:break-all;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; justify-content:center;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%;}
  }
  #print-area{display:none;}
  #print-area.show{display:block;}
  #print-area .label-grid{grid-template-columns:repeat(3,1fr);}

  .empty-cta{color:var(--muted); font-size:13px; margin-top:6px;}
  .help-note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5;}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .row-actions button{padding:6px 10px; font-size:12px; white-space:nowrap;}
</style>
</head>

  // Icono generico de respaldo (una maleta de transporte), en el color de acento activo.
  const GENERIC_LOGO_SVG = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
    <rect x="9" y="2" width="12" height="6" rx="1.5" fill="var(--accent)"/>
    <rect x="2" y="7" width="26" height="20" rx="3" fill="var(--accent)"/>
    <rect x="6.5" y="14" width="4" height="4" rx="1" fill="var(--bg)"/>
    <rect x="19.5" y="14" width="4" height="4" rx="1" fill="var(--bg)"/>
    <rect x="13" y="14" width="4" height="6" rx="1" fill="var(--bg)"/>
  </svg>`;
  function getLogoHtml(){
    const b = state.config && state.config.branding;
    if(b && b.logo){
      return `<img src="${b.logo}" alt="Logo" style="height:32px; width:auto; flex-shrink:0; display:block;">`;
    }

  function hexToRgba(hex, alpha){
    hex = (hex||'').replace('#','');
    if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    const r = parseInt(hex.substring(0,2),16)||0;
    const g = parseInt(hex.substring(2,4),16)||0;
    const bch = parseInt(hex.substring(4,6),16)||0;
    return `rgba(${r},${g},${bch},${alpha})`;
  }

  async function fbGet(path){

  async function fbSet(path, data){

    try{
      await fetch(base+'/'+path+'.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});

  async function loadOperationalData(){

      const [itemsObj, logData, eventsObj] = await Promise.all([fbGet('items'), fbGet('log'), fbGet('events')]);
      state.items = itemsObj ? Object.values(itemsObj) : [];
      state.log = logData ? (Array.isArray(logData) ? logData : Object.values(logData)) : [];
      state.events = eventsObj ? Object.values(eventsObj) : [];
    }else{
      try{
        const [itemsRes, logRes, eventsRes] = await Promise.all([safeGet('inv-items', true), safeGet('inv-log', true), safeGet('inv-events', true)]);
        state.items = itemsRes ? JSON.parse(itemsRes.value) : [];
        state.log = logRes ? JSON.parse(logRes.value) : [];
        state.events = eventsRes ? JSON.parse(eventsRes.value) : [];

  // Procesa un código escaneado y devuelve el resultado, sin tocar la pantalla.
  // Así se puede reutilizar tanto en un escaneo normal como en el modo continuo con cámara.
  function processScan(code){
    if(state.scanMode === 'alta'){
      const existing = findItem(code);
      if(existing){
        return {type:'error', text:'Ese código ya está registrado como "'+existing.name+'" ('+statusLabel(existing.status)+'). Usa "Mover equipo" para cambiar su estado.'};
      }
      state.altaDraft = {code, name:'', category: state.config.categories[0], notes:'', responsable:'', categoryOther:''};
      return null; // sin mensaje: se mostrará el formulario de alta
    }
    // Modo automático: detecta el estado actual y lo invierte
    const item = findItem(code);
    if(!item){
      return {type:'error', text:'Código "'+code+'" no está registrado. Cámbiate a "Alta de equipo nuevo" para darlo de alta.'};
    }
    if(item.status === 'fuera_servicio'){
      return {type:'error', text:'"'+item.name+'" está marcado como fuera de servicio'+(item.faultReason?' ('+item.faultReason+')':'')+'. Reactívalo manualmente desde la pestaña Equipo antes de moverlo.'};
    }
    const newStatus = item.status === 'bodega' ? 'viaje' : 'bodega';
    item.status = newStatus;
    item.updatedAt = nowIso();
    saveItems();
    addLog({code:item.code, name:item.name, action: newStatus==='viaje' ? 'salida' : 'regreso', by: state.session.name});
    const text = newStatus==='viaje'
      ? '"'+item.name+'" salió de bodega — ahora en viaje.'
      : '"'+item.name+'" regresó a bodega.';
    return {type:'ok', text};
  }

  function handleScan(code){

  // Usado durante el escaneo continuo con cámara: no reconstruye toda la pantalla
  // (eso cortaría el video), solo agrega el resultado a una lista visible dentro del modal.
  function handleScanContinuous(code){
    const result = processScan(code);
    if(!result) return; // en modo alta no aplica el escaneo continuo
    const logEl = document.getElementById('cam-scan-log');
    if(!logEl) return;
    const div = document.createElement('div');
    div.className = 'last-scan ' + (result.type==='ok' ? 'ok' : 'error');
    div.style.marginBottom = '8px';
    div.textContent = result.text;
    logEl.prepend(div);
    while(logEl.children.length > 8) logEl.removeChild(logEl.lastChild);
  }

  // ---------------- FOTOS DE EVIDENCIA ----------------
  function compressImageFile(file, maxDim){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function compressLogoFile(file, maxDim){
    // A diferencia de compressImageFile, conserva transparencia (PNG) — importante para logos.
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------------- IMPORTACIÓN POR LOTE (CSV) ----------------
  function splitCsvLine(line){
    const result = [];
    let cur = '', inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(inQuotes){
        if(c === '"'){
          if(line[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        }else cur += c;
      }else{
        if(c === '"') inQuotes = true;
        else if(c === ','){ result.push(cur); cur=''; }
        else cur += c;
      }
    }
    result.push(cur);
    return result;
  }
  function parseCsv(text){
    const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length>0);
    if(lines.length===0) return [];
    const headers = splitCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
    const rows = [];
    for(let i=1;i<lines.length;i++){
      const cols = splitCsvLine(lines[i]);
      const obj = {};
      headers.forEach((h,idx)=>{ obj[h] = (cols[idx]||'').trim(); });
      rows.push(obj);
    }
    return rows;
  }
  function getCsvField(row, aliases){
    for(const a of aliases){
      if(row[a] !== undefined && row[a] !== '') return row[a];
    }
    return '';
  }
  function rowsToPreview(rows){
    return rows.map(r=>({
      name: getCsvField(r, ['nombre','name']),
      category: getCsvField(r, ['categoria','categoría','category']) || state.config.categories[0],
      responsable: getCsvField(r, ['responsable']),
      notes: getCsvField(r, ['notas','nota','notes']),
      code: getCsvField(r, ['codigo','código','code'])
    })).filter(r=>r.name);
  }
  function finishImportParse(parsed){
    if(parsed.length === 0){
      alert('No se encontró ninguna fila con nombre válido en el archivo. Revisa que la columna se llame "nombre".');
      return;
    }
    state.importPreview = parsed;
    render();
  }
  function handleImportFile(file){
    const nameLower = (file.name||'').toLowerCase();
    const isExcel = nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls');
    const reader = new FileReader();
    reader.onerror = ()=> alert('No se pudo leer el archivo.');
    if(isExcel){
      reader.onload = ()=>{
        if(typeof XLSX === 'undefined'){
          alert('No se pudo cargar la herramienta para leer Excel. Revisa tu conexión a internet e intenta de nuevo, o sube un CSV.');
          return;
        }
        try{
          const data = new Uint8Array(reader.result);
          const wb = XLSX.read(data, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(ws, {defval:''});
          const rows = json.map(row=>{
            const o = {};
            Object.keys(row).forEach(k=>{
              o[k.toString().trim().toLowerCase()] = (row[k]===undefined||row[k]===null) ? '' : String(row[k]).trim();
            });
            return o;
          });
          finishImportParse(rowsToPreview(rows));
        }catch(e){
          console.error('Error leyendo Excel', e);
          alert('No se pudo leer el archivo de Excel. Verifica que no esté dañado o protegido con contraseña.');
        }
      };
      reader.readAsArrayBuffer(file);
    }else{
      reader.onload = ()=>{
        const rows = parseCsv(reader.result);
        finishImportParse(rowsToPreview(rows));
      };
      reader.readAsText(file, 'UTF-8');
    }
  }
  function cancelImport(){
    state.importPreview = null;

  }
  function confirmImport(){
    if(!state.importPreview || state.importPreview.length===0) return;
    const existingCodes = new Set(state.items.map(it=>it.code));
    let addedCategory = false;
    state.importPreview.forEach(row=>{
      let code = row.code && row.code.trim() ? row.code.trim() : genId();
      while(existingCodes.has(code)){ code = genId(); }
      existingCodes.add(code);
      const category = (row.category && row.category.trim()) ? row.category.trim() : state.config.categories[0];
      if(!state.config.categories.includes(category)){
        state.config.categories.push(category);
        addedCategory = true;
      }
      const newItem = {
        code, name: row.name.trim(), category, status:'bodega',
        notes: row.notes||'', responsable: row.responsable||'',
        addedAt: nowIso(), updatedAt: nowIso()
      };
      state.items.push(newItem);
      state.log.unshift({code, name:newItem.name, action:'alta', by: state.session.name, at: nowIso()});
    });
    const count = state.importPreview.length;
    saveItems();
    saveLog();
    if(addedCategory) saveConfig();
    state.importPreview = null;
    render();
    alert(count + ' equipo(s) importado(s) correctamente. Ve a la pestaña Etiquetas para generar e imprimir sus códigos QR.');
  }

  function downloadJsonFile(filename, dataObj){

    a.href = url;
    a.download = filename;

    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- CAMERA ----------------
  let lastContinuousCode = null;
  let lastContinuousTime = 0;

  function cameraErrorMessage(e){
    const name = (e && e.name) ? e.name : 'Error';
    let detail;
    if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      detail = 'El permiso de cámara está bloqueado para esta página. En iPhone: Ajustes → Safari → Cámara → "Preguntar" o "Permitir", y vuelve a abrir la app.';
    }else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
      detail = 'No se encontró ninguna cámara en este dispositivo.';
    }else if(name === 'NotReadableError' || name === 'TrackStartError'){
      detail = 'La cámara está siendo usada por otra app. Ciérrala e intenta de nuevo.';
    }else if(name === 'SecurityError'){
      detail = 'El navegador bloqueó la cámara porque la página no se abrió por una conexión segura (https).';
    }else if(e && e.message === 'NoMediaDevices'){
      detail = 'Este navegador no permite usar la cámara desde esta página.';
    }else{
      detail = 'Detalle técnico: ' + name + (e && e.message ? ' — ' + e.message : '');
    }
    return 'No se pudo abrir la cámara en vivo. ' + detail + ' Mientras tanto puedes usar el botón "Tomar foto del código".';
  }

  async function openCamera(){
    state.cameraOpen = true;
    lastContinuousCode = null;
    lastContinuousTime = 0;
    // Quita el foco de cualquier campo de texto para que no se abra el teclado encima de la cámara
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('NoMediaDevices');
      }
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
      if(!state.cameraOpen){
        // Se cerró el modal mientras se esperaba el permiso
        stream.getTracks().forEach(t => t.stop());
        return;
      }
      cameraStream = stream;
      const video = document.getElementById('cam-video');
      if(!video) throw new Error('No se encontró el video en pantalla');
      video.muted = true;
      video.setAttribute('playsinline','');
      video.setAttribute('webkit-playsinline','');
      video.srcObject = cameraStream;
      // No esperamos a que play() termine: en iPhone a veces tarda o se rechaza aunque el video sí corra
      const p = video.play();
      if(p && p.catch) p.catch(err => console.warn('video.play() fue rechazado', err));
      scanLoop();
    }catch(e){
      console.error('Error de cámara', e);
      state.lastScanMsg = {type:'error', text: cameraErrorMessage(e)};
      closeCamera();
    }
  }
  let lastDecodeTime = 0;
  function scanLoop(){
    const video = document.getElementById('cam-video');
    const canvas = document.getElementById('cam-canvas');
    if(!video || !canvas) return;
    const now = Date.now();
    if(video.readyState >= 2 && video.videoWidth > 0 && (now - lastDecodeTime) > 120){
      lastDecodeTime = now;
      // Reducimos el cuadro antes de analizarlo: más rápido y fluido en celulares
      const scale = Math.min(1, 960 / video.videoWidth);
      const w = Math.round(video.videoWidth * scale);
      const h = Math.round(video.videoHeight * scale);
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(video, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const result = jsQR(imageData.data, w, h, {inversionAttempts:'dontInvert'});
      if(result && result.data){
        if(state.cameraContinuous){
          if(result.data !== lastContinuousCode || (now - lastContinuousTime) > 2500){
            lastContinuousCode = result.data;
            lastContinuousTime = now;
            handleScanContinuous(result.data);
          }
          // sigue escaneando sin cerrar la cámara
        }else{
          closeCamera();
          handleScan(result.data);
          return;
        }
      }
    }
    cameraRAFId = requestAnimationFrame(scanLoop);
  }

  // ---------- Respaldo: leer el QR desde una foto tomada con la cámara normal del teléfono ----------
  function fileToImage(file){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
      img.src = url;
    });
  }
  async function handleQrPhoto(file){
    try{
      const img = await fileToImage(file);
      let found = null;
      for(const maxDim of [1600, 1000, 640]){
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h);
        const result = jsQR(data.data, w, h, {inversionAttempts:'attemptBoth'});
        if(result && result.data){ found = result.data; break; }
      }
      if(found){
        handleScan(found);
      }else{
        state.lastScanMsg = {type:'error', text:'No pude leer ningún código QR en esa foto. Intenta de nuevo con el código centrado, bien enfocado y con buena luz.'};
        render();
      }
    }catch(e){
      console.error('Error leyendo la foto', e);
      state.lastScanMsg = {type:'error', text:'No se pudo procesar la foto. Intenta de nuevo.'};
      render();
    }
  }
  function closeCamera(){
    state.cameraOpen = false;
    if(cameraRAFId) cancelAnimationFrame(cameraRAFId);
    cameraRAFId = null;
    if(cameraStream){
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    render();
  }

  function cssSafe(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS_SEMANA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  function renderCalendario(){
    const isAdmin = state.session.role === 'admin';
    const year = state.calYear, month = state.calMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayStr = toDateStr(new Date());

    let cells = '';
    for(let i=0; i<firstDay; i++){ cells += `<div class="cal-cell cal-empty"></div>`; }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = year+'-'+pad2(month+1)+'-'+pad2(d);
      const evs = eventsForDate(dateStr);
      const salidas = salidasForDate(dateStr);
      const hasStuff = evs.length>0 || salidas.length>0;
      cells += `
        <div class="cal-cell ${dateStr===todayStr?'cal-today':''} ${state.calSelected===dateStr?'cal-selected':''}" data-day="${dateStr}">
          <div class="cal-daynum">${d}</div>
          ${hasStuff ? `<div class="cal-dots">${evs.length ? '<span class="cal-dot cal-dot-event"></span>' : ''}${salidas.length ? '<span class="cal-dot cal-dot-salida"></span>' : ''}</div>` : ''}
        </div>`;
    }

    let detailHtml = '';
    if(state.calSelected){
      const evs = eventsForDate(state.calSelected);
      const salidas = salidasForDate(state.calSelected);
      const [y,m,dd] = state.calSelected.split('-');
      detailHtml = `
        <div class="scan-panel" style="text-align:left; margin-top:18px;">
          <h3 style="font-size:15px; margin-bottom:12px;">${dd}/${m}/${y}</h3>
          ${salidas.length ? `
            <div style="margin-bottom:14px;">
              <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;">Equipo que salió este día</div>
              ${salidas.map(l=>`<div style="font-size:13px; margin-bottom:4px;">🚚 ${escapeHtml(l.name)} <span style="color:var(--muted);">(${escapeHtml(l.by||'')})</span></div>`).join('')}
            </div>` : ''}
          ${evs.length ? `
            <div style="margin-bottom:10px;">
              <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;">Eventos</div>
              ${evs.map(e=>{
                const assigned = (e.equipmentCodes||[]).map(code=>findItem(code)).filter(Boolean);
                return `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border);">
                  <div style="flex:1;">
                    <div style="font-size:14px; font-weight:600;">${e.time ? escapeHtml(e.time)+' — ' : ''}${escapeHtml(e.title)}</div>
                    ${e.notes ? `<div style="font-size:12px; color:var(--muted); margin-top:2px;">${escapeHtml(e.notes)}</div>` : ''}
                    <div style="font-size:12px; color:var(--muted); margin-top:6px;">
                      <strong>Equipo para este evento:</strong> ${assigned.length ? assigned.map(it=>escapeHtml(it.name)).join(', ') : 'ninguno asignado todavía'}
                    </div>
                    ${isAdmin ? `<button class="btn-secondary" data-assign-equipment="${e.id}" style="margin-top:6px; font-size:12px; padding:5px 10px;">Elegir equipo</button>` : ''}
                  </div>
                  ${isAdmin ? `<button class="btn-danger" data-delevent="${e.id}" style="font-size:11px; padding:5px 8px;">Eliminar</button>` : ''}
                </div>
              `;}).join('')}
            </div>` : ''}
          ${(!salidas.length && !evs.length) ? `<div class="help-note" style="margin-bottom:10px;">Sin eventos ni movimientos registrados este día.</div>` : ''}
          ${isAdmin ? (
            state.eventDraftOpen ? `
              <div class="alta-form" style="margin:10px 0 0;">
                <div class="field"><label>Título</label><input id="event-title" placeholder="Ej. Evento en Salón X"></div>
                <div class="field"><label>Hora (opcional)</label><input id="event-time" placeholder="Ej. 18:00"></div>
                <div class="field"><label>Notas (opcional)</label><textarea id="event-notes" rows="2"></textarea></div>
                <div style="display:flex; gap:10px;">
                  <button id="event-cancel" class="btn-secondary" style="flex:1;">Cancelar</button>
                  <button id="event-save" class="btn-primary" style="flex:1;">Guardar evento</button>
                </div>
              </div>
            ` : `<button id="add-event-btn" class="btn-primary">+ Agregar evento</button>`
          ) : ''}
        </div>`;
    }

    return `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <button id="cal-prev" class="btn-secondary">←</button>
        <h3 style="font-size:17px;">${MESES[month]} ${year}</h3>
        <button id="cal-next" class="btn-secondary">→</button>
      </div>
      <div class="cal-grid cal-grid-header">${DIAS_SEMANA.map(d=>`<div class="cal-weekday">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="help-note" style="margin-top:10px;"><span class="cal-dot cal-dot-event" style="position:relative; top:2px;"></span> evento &nbsp; <span class="cal-dot cal-dot-salida" style="position:relative; top:2px;"></span> equipo que salió</div>
      ${detailHtml}
      ${state.equipmentModalEventId ? renderEquipmentModal(state.events.find(e=>e.id===state.equipmentModalEventId)) : ''}
    `;
  }

  function renderEquipmentModal(ev){
    if(!ev) return '';
    const q = state.equipmentModalSearch.toLowerCase();
    const list = state.items.filter(it => !q || it.name.toLowerCase().includes(q) || it.category.toLowerCase().includes(q));
    return `

              <input type="checkbox" data-equip-code="${escapeHtml(it.code)}" ${state.equipmentModalSelected[it.code] ? 'checked' : ''}>

  function renderHistorial(){
    if(state.log.length===0){
      return `<div class="empty-state">Todavía no hay movimientos registrados.</div>`;
    }
    const actionLabel = {alta:'Alta', salida:'Salida a viaje', regreso:'Regreso a bodega', fuera_servicio:'Marcado fuera de servicio', reactivado:'Reactivado (a bodega)', foto:'Foto agregada', vaciado:'Inventario vaciado'};
    return `

      </tbody>

    const connected = !!(state.config.firebaseUrl);
    const brand = state.config.branding || {logo:null, accent:null, headerBg:null, bg:null};
    return `
    <h3 style="margin-bottom:14px;">Marca y apariencia</h3>
    <div class="ticket" style="max-width:520px; margin:0 0 24px; padding:20px;">
      <div class="field">
        <label>Logo</label>
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:10px;">
          <div class="logo-chip">${getLogoHtml()}</div>

        <input type="file" id="logo-file-input" accept="image/png,image/jpeg,image/svg+xml">

        <div class="help-note">Sube una imagen con fondo transparente (PNG) si es posible, para que se vea bien sobre el color del encabezado.</div>
      </div>

      <div class="field">
        <label>Color de fondo general</label>
        <input type="color" id="brand-bg" value="${brand.bg || DEFAULT_BRAND_COLORS.bg}" style="width:70px; height:38px; padding:2px;">
      </div>
      <div style="display:flex; gap:10px;">
        <button id="save-brand-colors-btn" class="btn-primary">Guardar colores</button>
        <button id="reset-brand-colors-btn" class="btn-secondary">Restaurar valores por defecto</button>
      </div>
    </div>
    <h3 style="margin-bottom:14px;">Conexión con Telegram</h3>
    <div class="ticket" style="max-width:520px; margin:0 0 24px; padding:20px;">
      <div style="margin-bottom:12px;">
        <span class="status-badge ${connected?'bodega':'viaje'}">${connected ? 'Conectado' : 'No conectado'}</span>
      </div>
      <div class="field">
        <label>URL de la base de datos (Firebase)</label>

      <div class="help-note">Pega aquí la URL que te dio Firebase al crear tu Realtime Database. En cuanto la guardes, tu bot de Telegram podrá leer el inventario. Ten en cuenta que con las reglas de "modo de prueba" cualquiera con esta URL puede ver los datos — no la compartas fuera de tu equipo.</div>

    <div class="help-note">Para cambiar nombres o PINs, dilo aquí en el chat y ajusto el archivo, o edítalo directo en el código de la app.</div>
    <h3 style="margin:24px 0 14px;">Categorías</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
      ${state.config.categories.map(c=>`<span class="status-badge bodega">${escapeHtml(c)}</span>`).join('')}
    </div>
    <form id="add-cat-form" style="display:flex; gap:10px; max-width:400px;">
      <input name="newcat" placeholder="Nueva categoría..." style="flex:1;">
      <button type="submit" class="btn-secondary">Agregar</button>
    </form>

    <h3 style="margin:28px 0 14px;">Respaldo de datos</h3>
    <div class="ticket" style="max-width:520px; margin:0 0 10px; padding:20px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
        <button id="export-excel-btn" class="btn-primary">📊 Descargar Excel</button>
        <button id="export-json-btn" class="btn-secondary">🗂️ Respaldo completo (JSON)</button>
      </div>
      <div class="help-note">
        <strong>Excel</strong>: equipo, historial y eventos en un archivo fácil de abrir y compartir (no incluye fotos, por tamaño).<br><br>
        <strong>JSON</strong>: respaldo técnico con todos los datos (incluidas las fotos). Guárdalo en un lugar seguro por si algún día necesitas recuperar todo tal cual estaba.
      </div>
    </div>

    <h3 style="margin:28px 0 14px;">Importar equipo por lote</h3>
    ${!state.importPreview ? `
      <div class="ticket" style="max-width:520px; margin:0; padding:20px;">
        <div class="field">
          <label>Archivo CSV o Excel (.xls / .xlsx)</label>
          <input type="file" id="import-file-input" accept=".csv,.xls,.xlsx">
        </div>
        <div class="help-note">
          El archivo debe tener estas columnas en la primera fila (en cualquier orden): <strong>nombre</strong> (obligatorio), <strong>categoria</strong>, <strong>responsable</strong>, <strong>notas</strong>, <strong>codigo</strong> (opcional — si lo dejas vacío, se genera uno automático).<br><br>
          Ejemplo:<br>
          <span class="mono">nombre,categoria,responsable,notas</span><br>
          <span class="mono">Micrófono SM58 #4,Micrófono,Ana,</span><br><br>
          Si usas Excel, solo asegúrate de que la primera fila tenga esos mismos nombres de columna. Se lee la primera hoja del archivo.<br><br>
          Después de importar, ve a la pestaña <strong>Etiquetas</strong> para generar e imprimir el código QR de cada equipo nuevo.
        </div>
      </div>
    ` : `
      <div class="ticket" style="max-width:560px; margin:0; padding:20px;">
        <div style="margin-bottom:10px;">Se encontraron <strong>${state.importPreview.length}</strong> equipo(s) en el archivo. Vista previa:</div>
        <div class="table-wrap" style="margin-bottom:14px; max-height:260px; overflow-y:auto;">
          <table>
            <thead><tr><th>Nombre</th><th>Categoría</th><th>Responsable</th></tr></thead>
            <tbody>
              ${state.importPreview.slice(0,50).map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.category)}</td><td>${escapeHtml(r.responsable)||'—'}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${state.importPreview.length>50 ? `<div class="help-note">Mostrando los primeros 50, pero se importarán los ${state.importPreview.length}.</div>` : ''}
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button id="import-cancel" class="btn-secondary" style="flex:1;">Cancelar</button>
          <button id="import-confirm" class="btn-primary" style="flex:1;">Confirmar importación</button>
        </div>
      </div>
    `}

    <h3 style="margin:28px 0 14px;">Vaciar inventario</h3>
    <div class="ticket" style="max-width:520px; margin:0; padding:20px;">
      <div class="help-note" style="margin-bottom:14px;">Elimina de golpe todo el equipo registrado (${state.items.length} en este momento) — útil si vas a reemplazar tu lista completa por una importación nueva. El historial y el calendario no se tocan. Esta acción no se puede deshacer.</div>
      <button id="clear-items-btn" class="btn-danger">🗑️ Eliminar todo el equipo</button>
    </div>
    `;
  }

  function renderApp(){
    if(state.loading){
      return `<div class="center-screen"><div style="color:var(--muted);">Cargando inventario...</div></div>`;
    }
    if(state.firebaseDenied){
      return `
      <div class="center-screen">
        <div class="ticket">
          <h2>Sin acceso a la base de datos</h2>
          <div class="sub">Firebase rechazó la conexión — normalmente pasa cuando las reglas de acceso de "modo de prueba" vencieron.</div>
          <div class="help-note" style="margin-bottom:16px;">Revisa en la consola de Firebase: Realtime Database → pestaña Reglas. Ahí debería decir si ya expiraron, con opción de actualizarlas. Ninguno de tus datos se borró — solo está bloqueado el acceso hasta corregir esto.</div>
          <button id="retry-firebase-btn" class="btn-primary" style="width:100%;">Reintentar</button>
        </div>
      </div>`;
    }
    if(!state.config){
      return renderSetup();
    }
    if(!state.session){
      return renderLogin();
    }
    let body = '';
    if(state.tab==='resumen') body = renderResumen();
    else if(state.tab==='escanear') body = renderEscanear();
    else if(state.tab==='etiquetas') body = renderEtiquetas();
    else if(state.tab==='calendario') body = renderCalendario();
    else if(state.tab==='historial') body = renderHistorial();
    else if(state.tab==='config') body = renderConfig();
    return renderTopbar() + renderTabs() + `<div class="content">${body}</div>`;
  }

  function render(){
    document.getElementById('app').innerHTML = renderApp();
    attachListeners();
  }

  // ---------------- LISTENERS ----------------
  function attachListeners(){
    const app = document.getElementById('app');

    const retryFirebaseBtn = document.getElementById('retry-firebase-btn');
    if(retryFirebaseBtn){
      retryFirebaseBtn.addEventListener('click', ()=>{
        state.firebaseDenied = false;
        state.loading = true;
        render();
        loadAll();
      });
    }
    const setupForm = document.getElementById('setup-form');
    if(setupForm){
      setupForm.addEventListener('submit', e=>{
        e.preventDefault();
        const fd = new FormData(setupForm);
        const admins = [0,1,2].map(i=>({name: fd.get('name'+i).trim(), pin: fd.get('pin'+i).trim()}));
        if(admins.some(a=>!a.name || !a.pin)){
          state.setupErr = 'Completa los 3 nombres y PINs.';
          render(); return;
        }
        const pins = admins.map(a=>a.pin);
        if(new Set(pins).size !== pins.length){
          state.setupErr = 'Los 3 PINs deben ser diferentes entre sí.';
          render(); return;
        }
        state.setupErr = '';
        doSetup(admins);
      });
    }

    const loginForm = document.getElementById('login-form');
    if(loginForm){
      loginForm.addEventListener('submit', e=>{
        e.preventDefault();
        const pin = new FormData(loginForm).get('pin').trim();
        doLogin(pin);
      });
    }
    const viewerBtn = document.getElementById('viewer-login');
    if(viewerBtn) viewerBtn.addEventListener('click', doViewerLogin);

    const logoutBtn = document.getElementById('logout-btn');
    if(logoutBtn) logoutBtn.addEventListener('click', doLogout);

    app.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.tab = btn.dataset.tab;
        state.altaDraft = null;
        state.lastScanMsg = null;
        render();
      });
    });

    app.querySelectorAll('.mode-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.scanMode = btn.dataset.mode;
        state.altaDraft = null;
        state.lastScanMsg = null;
        if(state.scanMode !== 'auto') state.cameraContinuous = false;
        render();
      });
    });

    const searchInput = document.getElementById('search-input');
    if(searchInput){
      searchInput.addEventListener('input', ()=>{ state.search = searchInput.value; render(); refocus(searchInput); });
    }
    const filterCat = document.getElementById('filter-cat');
    if(filterCat) filterCat.addEventListener('change', ()=>{ state.filterCat = filterCat.value; render(); });
    const filterStatus = document.getElementById('filter-status');
    if(filterStatus) filterStatus.addEventListener('change', ()=>{ state.filterStatus = filterStatus.value; render(); });

    app.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteItem(btn.dataset.del));
    });
    app.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=> openEditItem(btn.dataset.edit));
    });
    app.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=> toggleStatus(btn.dataset.toggle));
    });
    app.querySelectorAll('[data-fault]').forEach(btn=>{
      btn.addEventListener('click', ()=> openFaultModal(btn.dataset.fault));
    });
    app.querySelectorAll('[data-reactivate]').forEach(btn=>{
      btn.addEventListener('click', ()=> reactivateItem(btn.dataset.reactivate));
    });
    const faultCancel = document.getElementById('fault-cancel');
    if(faultCancel) faultCancel.addEventListener('click', closeFaultModal);
    const faultSave = document.getElementById('fault-save');
    if(faultSave){
      faultSave.addEventListener('click', ()=>{
        confirmFault(
          document.getElementById('fault-reason').value,
          document.getElementById('fault-note').value
        );
      });
    }

    // ---- Selector de fotos (compartido entre modal de fault y de evidencia) ----
    const photoFileInput = document.getElementById('photo-file-input');
    if(photoFileInput){
      photoFileInput.addEventListener('change', ()=>{
        if(photoFileInput.files && photoFileInput.files.length){
          handlePhotoFilesSelected(photoFileInput.files);
        }
      });
    }
    app.querySelectorAll('[data-remove-pending]').forEach(btn=>{
      btn.addEventListener('click', ()=> removePendingPhoto(parseInt(btn.dataset.removePending,10)));
    });

    // ---- Botones de fotos en la tabla ----
    app.querySelectorAll('[data-gallery]').forEach(btn=>{
      btn.addEventListener('click', ()=> openGallery(btn.dataset.gallery));
    });
    app.querySelectorAll('[data-addphoto]').forEach(btn=>{
      btn.addEventListener('click', ()=> openPhotoModal(btn.dataset.addphoto));
    });

    // ---- Modal de agregar foto de evidencia ----
    const photoCancel = document.getElementById('photo-cancel');
    if(photoCancel) photoCancel.addEventListener('click', closePhotoModal);
    const photoSave = document.getElementById('photo-save');
    if(photoSave){
      photoSave.addEventListener('click', ()=>{
        confirmPhotos(document.getElementById('photo-label').value);
      });
    }

    // ---- Modal de galería ----
    const galleryClose = document.getElementById('gallery-close-btn');
    if(galleryClose) galleryClose.addEventListener('click', closeGallery);
    app.querySelectorAll('[data-fullphoto]').forEach(img=>{
      img.addEventListener('click', ()=>{
        const item = findItem(img.dataset.fullcode);
        const idx = parseInt(img.dataset.fullphoto,10);
        if(item && item.photos && item.photos[idx]){
          window.open(item.photos[idx].data, '_blank');
        }
      });
    });
    app.querySelectorAll('[data-delphoto]').forEach(btn=>{
      btn.addEventListener('click', ()=> deletePhoto(btn.dataset.delphotocode, parseInt(btn.dataset.delphoto,10)));
    });

    // ---- Calendario ----
    const calPrev = document.getElementById('cal-prev');
    if(calPrev) calPrev.addEventListener('click', ()=> changeMonth(-1));
    const calNext = document.getElementById('cal-next');
    if(calNext) calNext.addEventListener('click', ()=> changeMonth(1));
    app.querySelectorAll('[data-day]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        state.calSelected = (state.calSelected === cell.dataset.day) ? null : cell.dataset.day;
        state.eventDraftOpen = false;
        render();
      });
    });
    const addEventBtn = document.getElementById('add-event-btn');
    if(addEventBtn) addEventBtn.addEventListener('click', ()=>{ state.eventDraftOpen = true; render(); });
    const eventCancel = document.getElementById('event-cancel');
    if(eventCancel) eventCancel.addEventListener('click', ()=>{ state.eventDraftOpen = false; render(); });
    const eventSave = document.getElementById('event-save');
    if(eventSave){
      eventSave.addEventListener('click', ()=>{
        addCalendarEvent({
          title: document.getElementById('event-title').value,
          time: document.getElementById('event-time').value,
          notes: document.getElementById('event-notes').value
        });
      });
    }
    app.querySelectorAll('[data-delevent]').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteCalendarEvent(btn.dataset.delevent));
    });
    app.querySelectorAll('[data-assign-equipment]').forEach(btn=>{
      btn.addEventListener('click', ()=> openEquipmentModal(btn.dataset.assignEquipment));
    });
    const equipmentSearch = document.getElementById('equipment-modal-search');
    if(equipmentSearch){
      equipmentSearch.addEventListener('input', ()=>{
        state.equipmentModalSearch = equipmentSearch.value;
        render();
        refocus(equipmentSearch);
      });
    }
    app.querySelectorAll('[data-equip-code]').forEach(cb=>{
      cb.addEventListener('change', ()=> toggleEquipmentSelection(cb.dataset.equipCode));
    });
    const equipmentCancel = document.getElementById('equipment-cancel');
    if(equipmentCancel) equipmentCancel.addEventListener('click', closeEquipmentModal);
    const equipmentSave = document.getElementById('equipment-save');
    if(equipmentSave) equipmentSave.addEventListener('click', confirmEquipmentSelection);

    const editCancel = document.getElementById('edit-cancel');
    if(editCancel) editCancel.addEventListener('click', closeEdit);
    const editSave = document.getElementById('edit-save');
    if(editSave){
      editSave.addEventListener('click', ()=>{
        saveEditItem({
          name: document.getElementById('edit-name').value,
          category: document.getElementById('edit-category').value,
          responsable: document.getElementById('edit-responsable').value,
          notes: document.getElementById('edit-notes').value
        });
      });
    }

    const scanInput = document.getElementById('scan-input');
    if(scanInput){
      // Solo enfoca solo en computadoras (para el lector USB); en celulares abriría el teclado encima de la cámara
      const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if(!coarsePointer && !state.cameraOpen) scanInput.focus();
      scanInput.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          const val = scanInput.value;
          scanInput.value = '';
          handleScan(val);
        }
      });
    }
    const camBtn = document.getElementById('open-camera-btn');
    if(camBtn) camBtn.addEventListener('click', openCamera);
    const qrPhotoBtn = document.getElementById('qr-photo-btn');
    const qrPhotoInput = document.getElementById('qr-photo-input');
    if(qrPhotoBtn && qrPhotoInput){
      qrPhotoBtn.addEventListener('click', ()=> qrPhotoInput.click());
      qrPhotoInput.addEventListener('change', ()=>{
        if(qrPhotoInput.files && qrPhotoInput.files[0]){
          handleQrPhoto(qrPhotoInput.files[0]);
        }
      });
    }
    const camClose = document.getElementById('cam-close-btn');
    if(camClose) camClose.addEventListener('click', closeCamera);
    const continuousCb = document.getElementById('continuous-checkbox');
    if(continuousCb){
      continuousCb.addEventListener('change', ()=>{ state.cameraContinuous = continuousCb.checked; });
    }
    const genCodeBtn = document.getElementById('gen-code-btn');
    if(genCodeBtn) genCodeBtn.addEventListener('click', generateNewCode);

    const altaCategorySelect = document.getElementById('alta-category');
    if(altaCategorySelect){
      altaCategorySelect.addEventListener('change', ()=>{
        const wrap = document.getElementById('alta-category-other-wrap');
        if(wrap) wrap.style.display = altaCategorySelect.value === 'Otro' ? 'block' : 'none';
      });
    }

    const altaCancel = document.getElementById('alta-cancel');
    if(altaCancel) altaCancel.addEventListener('click', ()=>{ state.altaDraft = null; render(); });
    const altaSave = document.getElementById('alta-save');
    if(altaSave){
      altaSave.addEventListener('click', ()=>{
        let category = document.getElementById('alta-category').value;
        if(category === 'Otro'){
          const otherVal = document.getElementById('alta-category-other').value.trim();
          if(!otherVal){ alert('Escribe el nombre de la nueva categoría.'); return; }
          category = otherVal;
          if(!state.config.categories.includes(category)){
            state.config.categories.push(category);
            saveConfig();
          }
        }
        const draft = {
          code: document.getElementById('alta-code').value,
          name: document.getElementById('alta-name').value,
          category: category,
          notes: document.getElementById('alta-notes').value,
          responsable: document.getElementById('alta-responsable').value
        };
        if(!draft.name.trim()){
          alert('Ponle un nombre al equipo.');
          return;
        }
        confirmAlta(draft);
      });
    }
    const qrPreview = document.getElementById('alta-qr-preview');
    if(qrPreview && state.altaDraft){
      qrPreview.innerHTML = '';
      const box = document.createElement('div');
      box.style.background='#fff'; box.style.display='inline-block'; box.style.padding='8px'; box.style.borderRadius='4px';
      qrPreview.appendChild(box);
      new QRCode(box, {text: state.altaDraft.code, width:120, height:120});
    }

    if(state.tab==='etiquetas'){
      state.items.forEach(it=>{
        const box = document.getElementById('qr-'+cssSafe(it.code));
        if(box && !box.dataset.rendered){
          box.dataset.rendered = '1';
          new QRCode(box, {text: it.code, width:100, height:100});
        }
      });
      app.querySelectorAll('[data-print-code]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          state.printSelection[cb.dataset.printCode] = cb.checked;
        });
      });
      const printBtn = document.getElementById('print-selected-btn');
      if(printBtn){
        printBtn.addEventListener('click', ()=>{
          const selected = state.items.filter(it=>state.printSelection[it.code]);
          if(selected.length===0){ alert('Selecciona al menos un equipo para imprimir.'); return; }
          const printGrid = document.getElementById('print-grid');
          printGrid.innerHTML='';
          selected.forEach(it=>{
            const card = document.createElement('div');
            card.className='label-card';
            const qrBox = document.createElement('div');
            qrBox.className='qr-box';
            card.appendChild(qrBox);
            const nameDiv = document.createElement('div');
            nameDiv.textContent = it.name;
            card.appendChild(nameDiv);
            const codeDiv = document.createElement('div');
            codeDiv.className='code';
            codeDiv.textContent = it.code;
            card.appendChild(codeDiv);
            printGrid.appendChild(card);
            new QRCode(qrBox, {text: it.code, width:110, height:110});
          });
          document.getElementById('print-area').classList.add('show');
          setTimeout(()=>{
            window.print();
            document.getElementById('print-area').classList.remove('show');
          }, 150);
        });
      }
    }

    const addCatForm = document.getElementById('add-cat-form');
    if(addCatForm){
      addCatForm.addEventListener('submit', e=>{
        e.preventDefault();
        const val = new FormData(addCatForm).get('newcat').trim();
        if(val && !state.config.categories.includes(val)){
          state.config.categories.push(val);
          saveConfig();
          render();
        }
      });
    }

    const importFileInput = document.getElementById('import-file-input');
    if(importFileInput){
      importFileInput.addEventListener('change', ()=>{
        if(importFileInput.files && importFileInput.files[0]){
          handleImportFile(importFileInput.files[0]);
        }
      });
    }
    const importCancel = document.getElementById('import-cancel');
    if(importCancel) importCancel.addEventListener('click', cancelImport);
    const importConfirm = document.getElementById('import-confirm');
    if(importConfirm) importConfirm.addEventListener('click', confirmImport);
    const clearItemsBtn = document.getElementById('clear-items-btn');
    if(clearItemsBtn) clearItemsBtn.addEventListener('click', clearAllItems);

    const saveFirebaseBtn = document.getElementById('save-firebase-btn');
    if(saveFirebaseBtn){
      saveFirebaseBtn.addEventListener('click', async ()=>{
        const val = document.getElementById('firebase-url-input').value.trim();
        if(!val){ alert('Pega primero la URL de tu base de datos.'); return; }
        saveFirebaseBtn.textContent = 'Sincronizando...';
        saveFirebaseBtn.disabled = true;
        await connectFirebase(val);
      });
    }
    const disconnectBtn = document.getElementById('disconnect-firebase-btn');
    if(disconnectBtn){
      disconnectBtn.addEventListener('click', async ()=>{
        if(confirm('¿Desconectar? La app volverá a guardar los datos solo localmente y el bot dejará de ver información nueva.')){
          await disconnectFirebase();
        }
      });
    }

    const logoFileInput = document.getElementById('logo-file-input');
    if(logoFileInput){
      logoFileInput.addEventListener('change', ()=>{
        if(logoFileInput.files && logoFileInput.files[0]){
          handleLogoFileSelected(logoFileInput.files[0]);
        }
      });
    }
    const removeLogoBtn = document.getElementById('remove-logo-btn');
    if(removeLogoBtn) removeLogoBtn.addEventListener('click', removeLogo);
    const saveBrandColorsBtn = document.getElementById('save-brand-colors-btn');
    if(saveBrandColorsBtn){
      saveBrandColorsBtn.addEventListener('click', ()=>{
        saveBrandColors(
          document.getElementById('brand-accent').value,
          document.getElementById('brand-header').value,
          document.getElementById('brand-bg').value
        );
      });
    }
    const resetBrandColorsBtn = document.getElementById('reset-brand-colors-btn');
    if(resetBrandColorsBtn) resetBrandColorsBtn.addEventListener('click', resetBrandColors);

    const exportExcelBtn = document.getElementById('export-excel-btn');
    if(exportExcelBtn) exportExcelBtn.addEventListener('click', exportToExcel);
    const exportJsonBtn = document.getElementById('export-json-btn');
    if(exportJsonBtn) exportJsonBtn.addEventListener('click', exportFullBackup);
  }

  function refocus(el){
    if(el){ const pos = el.value.length; el.focus(); el.setSelectionRange(pos,pos); }
  }

  loadAll();
})();
</script>
</body>
</html>
